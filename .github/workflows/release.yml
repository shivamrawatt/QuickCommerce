name: Backend Release

# on:
#   workflow_dispatch:
#     inputs:
#       version:
#         description: "Docker Image Version (Example: v1, v2, v1.0.0)"
#         required: true
#         default: "latest"


on:
  push:
    branches:
      - main        

jobs:
  release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-node

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t rrajivsingh/backend-app:${{ github.event.inputs.version }} .

      - name: Tag Image as Latest
        run: docker tag rrajivsingh/backend-app:${{ github.event.inputs.version }} rrajivsingh/backend-app:latest

      - name: Push Version Image
        run: docker push rrajivsingh/backend-app:${{ github.event.inputs.version }}

      - name: Push Latest Image
        run: docker push rrajivsingh/backend-app:latest